<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% if page.title %}
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  {% else %}
  <title>{{ site.title | escape }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  {% unless page.url == "/404.html" %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endunless %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <a href="{{ '/hi/' | relative_url }}">/hi</a>
      <a href="{{ '/now/' | relative_url }}">/now</a>
      <a href="{{ '/tea/' | relative_url }}">/tea</a>
      <a href="{{ '/bt/' | relative_url }}">/bt</a>
    </nav>
  </header>
  <main id="content">
    {{ content }}
  </main>
</body>
</html>
