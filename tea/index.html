<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tea time</title>
<meta name="description" content="tea time: most sundays, 11am to noon, on the outside patio at cafe creme downtown.">
<meta property="og:title" content="tea time">
<meta property="og:description" content="most sundays, 11am to noon, on the outside patio at cafe creme downtown.">
<meta property="og:image" content="https://adamisom.github.io/tea/poster-sunday.jpg">
<meta property="og:url" content="https://adamisom.github.io/tea/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plaster&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2eee3; --card:#fbf8f1; --ink:#222; --red:#a8261b; --muted:#6b655a; --rule:#ddd5c4; --dark:#45302a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1a17; --card:#26231f; --ink:#ece6da; --red:#e0604f; --muted:#a59e90; --rule:#3a362f; --dark:#d8c3b4; }
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { background:var(--bg); color:var(--ink); font-family:Inter,Helvetica,sans-serif; font-size:17px; line-height:1.6; }
  main { max-width:480px; margin:0 auto; padding:40px 20px 56px; }
  .top { display:flex; align-items:center; gap:8px 26px; flex-wrap:wrap; }
  h1 { font-family:Plaster,Georgia,serif; color:var(--red); font-weight:400; font-size:52px; line-height:1.05; }
  .when { font-size:16px; font-weight:600; line-height:1.3; color:var(--dark); margin-top:10px; }
  .status { margin:24px 0 24px; padding:12px 14px; font-size:15px; border:2px solid var(--red); border-radius:10px; background:var(--card); }
  .status b { color:var(--red); }
  dl { display:grid; gap:10px; }
  dl div { font-size:15px; letter-spacing:-0.01em; background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:10px 12px; }
  dt { display:inline; font-weight:600; color:var(--red); }
  dd { display:inline; }
  img { width:100%; border-radius:10px; margin:28px 0 8px; display:block; }
  a { color:var(--red); }
  .when .sep { display:none; }
  @media (max-width:480px) {
    main { padding:20px 20px 24px; }
    .top { gap:2px 26px; }
    .when { margin-top:0; }
    .when br { display:none; }
    .when .sep { display:inline; }
    .status { margin:16px 0; }
    img { margin:20px 0 0; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>tea time</h1>
    <p class="when">most sundays<span class="sep">, </span><br>11am to noon</p>
  </div>

  <div class="status"><b>first one:</b> soon. message me on <a href="https://x.com/adam__isom">x</a> or <a href="https://www.instagram.com/adam__isom/">ig</a></div>

  <dl>
    <div><dt>where:</dt> <dd><a href="https://maps.google.com/?q=Cafe+Creme+downtown+Austin">cafe creme downtown</a>, outside patio</dd></div>
    <div><dt>what:</dt> <dd>bring a life problem or a big question</dd></div>
    <div><dt>how:</dt> <dd>order inside, then find the tea sign</dd></div>
  </dl>

  <img src="poster-sunday.jpg" alt="Iroh telling Zuko to ask himself the big questions; Zuko asks: is tea just hot leaf juice?">

</main>
</body>
</html>
